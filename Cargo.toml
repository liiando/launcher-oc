[package]
name = "onlyclimb-launcher"
version = "0.4.0"
edition = "2021"

[dependencies]
iced = { version = "0.12", features = ["tokio", "image"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
aes-gcm = "0.10"
# Self-update: atomically swap the running .exe with a freshly downloaded one.
self-replace = "1"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
strip = true
